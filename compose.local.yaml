# Local container test before every deploy (same images as the server, built from source).
#   pnpm docker:local          -> build + start, UI on http://localhost:${FINANCE_LOCAL_PORT:-3000}
#   pnpm docker:local:down     -> stop
# Secrets come from apps/api/.env; data stays in ./data-local (bind mount, git-ignored).
name: finance-clone

networks:
  finance-internal: {}

services:
  finance-api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: finance-clone-api:local
    container_name: finance-api
    restart: unless-stopped
    env_file:
      - apps/api/.env
    environment:
      TZ: Europe/Berlin
      NODE_ENV: production
      PORT: '3001'
      DATABASE_PATH: /data/app.db
      COOKIE_SECURE: 'false'
    volumes:
      - ./data-local/api:/data
    networks:
      finance-internal: {}

  finance-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: finance-clone-web:local
    container_name: finance-web
    restart: unless-stopped
    environment:
      TZ: Europe/Berlin
      NUXT_API_BASE_URL: http://finance-api:3001
    ports:
      - '127.0.0.1:${FINANCE_LOCAL_PORT:-3000}:3000'
    depends_on:
      finance-api:
        condition: service_healthy
    networks:
      finance-internal: {}
