packages:
  - apps/*
  - packages/*

# Dependencies allowed to run install scripts (pnpm >= 11).
allowBuilds:
  # usage telemetry from swagger-ui-dist; keep disabled (FR-062)
  '@scarf/scarf': false
  '@parcel/watcher': true
  '@swc/core': true
  better-sqlite3: true
  esbuild: true
  unrs-resolver: true
  vue-demi: true
